# ============================================================================
# PRODUCTION PROFILE - PostgreSQL (Neon)
# ----------------------------------------------------------------------------
# application.properties defaults to SQLite for local development. Those
# defaults are WRONG in production: Render supplies a jdbc:postgresql:// URL,
# and pairing it with org.sqlite.JDBC makes HikariCP fail at startup with
# "Driver org.sqlite.JDBC claims to not accept jdbcUrl".
#
# This file overrides the driver and dialect to match. It is loaded because
# SPRING_PROFILES_ACTIVE=production.
#
# Required env vars on Render:
#   SPRING_DATASOURCE_URL       jdbc:postgresql://<host>/<db>?sslmode=require
#   SPRING_DATASOURCE_USERNAME  Neon role name
#   SPRING_DATASOURCE_PASSWORD  Neon role password
#
# Username/password are deliberately NOT declared here. Spring binds the two
# env vars above to spring.datasource.* on its own, and leaving them undeclared
# means a URL that already carries credentials keeps working. Declaring them
# with an empty default would instead send user="" and break authentication.
# ============================================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Neon closes idle connections; keep the pool small and recycle before it does.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=280000
spring.datasource.hikari.connection-timeout=30000
